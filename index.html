<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Namma Metro - Live Real-Time Network</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --purple: #8e24aa;
            --green: #43a047;
            --yellow: #fbc02d;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --border-glass: rgba(0, 0, 0, 0.1);
            --text-dark: #202124;
            --text-gray: #5f6368;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #f8f9fa;
            z-index: 1;
        }

        .leaflet-container {
            cursor: grab !important;
        }
        .leaflet-container.leaflet-drag-target,
        .leaflet-container:active {
            cursor: grabbing !important;
        }

        /* Non-blocking Rotational Train Markers */
        .train-icon {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transition: all 0.1s linear;
            z-index: 1000 !important;
            pointer-events: none !important; /* Pass-through clicks and drags directly to map */
            user-select: none !important;
        }
        .train-rect {
            width: 22px;
            height: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.1s linear;
            pointer-events: none !important;
        }
        .train-rect::after {
            content: '';
            width: 60%;
            height: 2px;
            background: rgba(255,255,255,0.9);
            border-radius: 1px;
            pointer-events: none !important;
        }
        .train-purple .train-rect { background-color: var(--purple); }
        .train-green .train-rect { background-color: var(--green); }
        .train-yellow .train-rect { background-color: var(--yellow); }
        .train-waiting .train-rect {
            box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 0 12px rgba(0,0,0,0.6);
        }

        /* Station Markers */
        .station-marker {
            border: 2px solid #fff;
            border-radius: 50%;
            width: 12px !important;
            height: 12px !important;
            margin-left: -6px !important;
            margin-top: -6px !important;
            z-index: 600 !important;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .marker-purple { background-color: var(--purple); }
        .marker-green { background-color: var(--green); }
        .marker-yellow { background-color: var(--yellow); }
        .station-marker:hover {
            transform: scale(1.6);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        
        .interchange-marker { 
            border-radius: 4px;
            width: 16px !important;
            height: 16px !important;
            margin-left: -8px !important;
            margin-top: -8px !important;
            border: 2px solid #fff;
            background-color: #333;
            z-index: 650 !important;
        }

        /* Glassmorphism UI */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            color: var(--text-dark);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            user-select: none;
        }

        /* Clock Overlay */
        .overlay-clock {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #43a047;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(67, 160, 71, 0); }
            100% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0); }
        }

        /* Legend Overlay */
        .overlay-legend {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            pointer-events: auto;
        }
        .legend-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-gray);
            margin-bottom: 12px;
            font-weight: 700;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-color { width: 14px; height: 4px; border-radius: 2px; }
        .legend-node {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .legend-interchange {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            border: 2px solid #fff;
            background: #333;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* Map Controls Toolbar */
        .map-controls {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .map-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            user-select: none;
        }
        .map-btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .map-btn:active {
            transform: translateY(0);
        }
        .map-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Light Mode Popups */
        .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            color: var(--text-dark);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
            overscroll-behavior: contain;
        }
        .leaflet-popup-tip { background: #fff; }
        .leaflet-popup-content { margin: 0; width: 320px !important; overscroll-behavior: contain; }
        .station-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            font-size: 1.15rem;
            font-weight: 700;
            background: #f8f9fa;
            letter-spacing: 0.2px;
            color: #111;
        }
        .departure-board {
            max-height: 260px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .departure-board::-webkit-scrollbar { width: 6px; }
        .departure-board::-webkit-scrollbar-track { background: #f1f1f1; }
        .departure-board::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .departure-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s;
        }
        .departure-item:hover { background: #fdfdfd; }
        .dep-title-row { display: flex; align-items: center; gap: 8px; }
        .m-logo {
            font-weight: 900;
            font-size: 14px;
            color: #fff;
            background: #333;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .line-badge {
            font-size: 10px;
            font-weight: bold;
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-purple { background-color: var(--purple); }
        .badge-green { background-color: var(--green); color: #fff; }
        .badge-yellow { background-color: var(--yellow); color: #000; }
        .destination-text { font-size: 14px; font-weight: 600; color: #222; }
        .dep-subtitle {
            font-size: 11px;
            color: var(--text-gray);
            padding-left: 28px;
            margin-top: 3px;
            font-weight: 500;
        }
        .dep-time {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .time-val {
            font-size: 18px;
            font-weight: 800;
            color: #1a73e8;
        }
        .time-due {
            font-size: 15px;
            font-weight: 800;
            color: #e53935;
            text-transform: uppercase;
        }
        .time-unit { font-size: 11px; color: var(--text-gray); font-weight: 500;}
        .no-trains {
            padding: 20px;
            text-align: center;
            color: var(--text-gray);
            font-style: italic;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="overlay-clock glass-panel">
        <div class="pulse-dot"></div>
        <span id="sys-clock">SYNCING TIME...</span>
    </div>
    
    <div class="overlay-legend glass-panel">
        <div class="legend-title">Network Legend</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--purple);"></div><span>Purple Line</span></div>
        <div class="legend-item"><div class="legend-color" style="background: var(--green);"></div><span>Green Line</span></div>
        <div class="legend-item"><div class="legend-color" style="background: var(--yellow);"></div><span>Yellow Line</span></div>
        <div style="height: 8px;"></div>
        <div class="legend-item"><div class="legend-node" style="background: var(--purple);"></div><span>Metro Station</span></div>
        <div class="legend-item"><div class="legend-interchange"></div><span>Interchange</span></div>
    </div>

    <!-- Quick Map Controls (Zoom In/Out, Fit Bounds, Fullscreen) -->
    <div class="map-controls">
        <button class="map-btn" id="btn-zoom-in" title="Zoom In">+</button>
        <button class="map-btn" id="btn-zoom-out" title="Zoom Out">−</button>

        </button>
        <button class="map-btn" id="btn-fullscreen" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
    </div>

    <div id="map"></div>

function normStation(name) {
  if (!name) return "";
  const s = name.trim();
  if (s === "Whitefield (Kadugodi)") return "Whitefield";
  if (s === "Kempegowda" || s === "Kempegowda Majestic" || s === "Kempegowda Station") return "Majestic";
  if (s === "Mysore Road") return "Mysuru Road";
  if (s === "Mahatma Gandhi Road" || s === "MG Road Metro") return "MG Road";
  if (s === "Krishnarajapura" || s === "KR Puram") return "K.R. Pura";
  if (s === "Mantri Square Sampige Road") return "Sampige Road";
  if (s === "Rashtreeya Vidyalaya Road") return "RV Road";
  if (s === "Jayadeva") return "Jayadeva Hospital";
  if (s === "Silk Board") return "Central Silk Board";
  return s;
}

function timeToSec(timeStr) { const [h, m] = timeStr.split(':').map(Number); return (h * 3600) + (m * 60); }
function getISTSecs() {
    const d = new Date(); const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
    const ist = new Date(utc + (3600000 * 5.5)); return (ist.getHours() * 3600) + (ist.getMinutes() * 60) + ist.getSeconds();
}
function getDayKey() {
    const d = new Date(); const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
    const ist = new Date(utc + (3600000 * 5.5)); const day = ist.getDay();
    if (day === 0) return 'sunday'; if (day === 1) return 'monday';
    if (day === 6) return 'saturday'; return 'tuesday_friday';
}

function getDiffMins(futureSecs, currentSecs) {
    let diff = futureSecs - currentSecs;
    if (diff < -43200) diff += 86400; 
    if (diff > 43200) diff -= 86400;
    return diff;
}

function getDistanceKM(lat1, lon1, lat2, lon2) {
    const p = 0.017453292519943295, c = Math.cos;
    const a = 0.5 - c((lat2 - lat1) * p)/2 + c(lat1 * p) * c(lat2 * p) * (1 - c((lon2 - lon1) * p))/2;
    return 12742 * Math.asin(Math.sqrt(a)); 
}

function catmullRomSpline(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return 0.5 * ( (2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3 );
}

function generateCurvedTrack(anchors, segments = 10) {
    const pts = anchors.map(s => ({x: s.lng, y: s.lat}));
    pts.unshift(pts[0]); pts.push(pts[pts.length - 1]);
    
    const track = [];
    for (let i = 1; i < pts.length - 2; i++) {
        track.push({ ...anchors[i-1], isAnchor: true });
        for (let t = 1; t <= segments; t++) {
            const percent = t / segments;
            const lng = catmullRomSpline(pts[i-1].x, pts[i].x, pts[i+1].x, pts[i+2].x, percent);
            const lat = catmullRomSpline(pts[i-1].y, pts[i].y, pts[i+1].y, pts[i+2].y, percent);
            if (t < segments) track.push({ lat, lng, isStation: false, isAnchor: false });
        }
    }
    track.push({ ...anchors[anchors.length - 1], isAnchor: true });
    
    const offset = 0.00010;
    track.forEach((pt, i) => {
        let prev = i > 0 ? track[i-1] : pt;
        let next = i < track.length - 1 ? track[i+1] : pt;
        let dx = next.lng - prev.lng;
        let dy = next.lat - prev.lat;
        let len = Math.sqrt(dx*dx + dy*dy) || 1;
        let nx = -dy / len;
        let ny = dx / len;
        
        pt.p1Lat = pt.lat + ny * offset;
        pt.p1Lng = pt.lng + nx * offset;
        pt.p2Lat = pt.lat - ny * offset;
        pt.p2Lng = pt.lng - nx * offset;
    });

    return track;
}

  purple: generateCurvedTrack(STATION_COORDS.purple, 8),
  green: generateCurvedTrack(STATION_COORDS.green, 8),
  yellow: generateCurvedTrack(STATION_COORDS.yellow, 8)

const INTERCHANGES = ['Majestic', 'RV Road', 'Jayadeva Hospital', 'Central Silk Board', 'Yeshwanthpur', 'K.R. Pura', 'Mysuru Road'];

function getDwell(stnName) {
  return INTERCHANGES.includes(normStation(stnName)) ? 35 : 20;
}

// ==========================================
// 4. LINE INDEX & PHYSICS INTERPOLATION
// ==========================================
class LineIndex {
  constructor(lineKey) {
    this.lineKey = lineKey;
    this.gtfs = GTFS_OFFSETS[lineKey];
    this.stationNames = this.gtfs.map(s => normStation(s.name));
    this.totalSec = this.gtfs[this.gtfs.length - 1].offsetSec;
    this.track = LINE_TRACKS[lineKey];

    this.stationTrackMap = new Map();
    this.track.forEach((pt, idx) => {
      if (pt.isStation && pt.name) {
        this.stationTrackMap.set(normStation(pt.name), idx);
      }
    });
  }

  getOffset(name, dir = 0) {
    const norm = normStation(name);
    const item = this.gtfs.find(s => normStation(s.name) === norm);
    if (!item) return 0;
    return dir === 0 ? item.offsetSec : this.totalSec - item.offsetSec;
  }

  getBetween(orig, dest, dir = 0) {
    const o = normStation(orig);
    const d = normStation(dest);
    const i1 = this.stationNames.indexOf(o);
    const i2 = this.stationNames.indexOf(d);
    if (i1 === -1 || i2 === -1) return [];
    return dir === 0 ? this.stationNames.slice(i1, i2 + 1) : this.stationNames.slice(i2, i1 + 1).reverse();
  }
}

const LINE_INDICES = {
  purple: new LineIndex("purple"),
  green: new LineIndex("green"),
  yellow: new LineIndex("yellow")
};

function createTrip({ id, lineKey, direction, origin, dest, depSec, isShortLoop = false }) {
  const lineIdx = LINE_INDICES[lineKey];
  const stations = lineIdx.getBetween(origin, dest, direction);
  if (stations.length < 2) return null;

  const baseOffset = lineIdx.getOffset(origin, direction);
  const stationTimings = [];

  for (let i = 0; i < stations.length; i++) {
    const stName = stations[i];
    const stOff = lineIdx.getOffset(stName, direction);
    const relSec = stOff - baseOffset;
    const arrSec = depSec + relSec;
    const dwell = (i !== 0 && i !== stations.length - 1) ? getDwell(stName) : 0;

    stationTimings.push({
      stationName: stName,
      arrSec,
      depSec: arrSec + dwell,
      dwellSec: dwell
    });
  }

  const endSec = stationTimings[stationTimings.length - 1].arrSec;

  return {
    id,
    lineKey,
    direction,
    originStation: normStation(origin),
    destStation: normStation(dest),
    startSec: depSec,
    endSec,
    totalSec: endSec - depSec,
    isShortLoop,
    stationTimings,
    platform: direction === 0 ? "Platform 2" : "Platform 1"
  };
}

const TRIPS_CACHE = new Map();

function generateDayTrips(dayKey) {
  if (TRIPS_CACHE.has(dayKey)) return TRIPS_CACHE.get(dayKey);

  const trips = [];
  let idCounter = 1;
  const loopType = (dayKey === 'sunday') ? 'sunday' : ((dayKey === 'saturday') ? 'saturday' : 'weekday');

  Object.keys(SCHEDULE_DATA).forEach(lineKey => {
    const config = SCHEDULE_DATA[lineKey];
    const sched = config.schedule[dayKey];
    const loopsConfig = SHORT_LOOPS_CONFIG[lineKey]?.[loopType];

    if (sched) {
      const term0 = config.termini[0];
      const term1 = config.termini[1];

      const dep0 = new Set();
      (sched[term0] || []).forEach(b => {
        let cur = timeToSec(b.from) + (b.offsetSec || 0);
        const end = timeToSec(b.to) + (b.offsetSec || 0);
        const step = Math.round(b.frequencyMin * 60);
        while (cur <= end) {
          if (!dep0.has(cur)) {
            dep0.add(cur);
            const t = createTrip({ id: `${lineKey}-0-${idCounter++}`, lineKey, direction: 0, origin: term0, dest: term1, depSec: cur });
            if (t) trips.push(t);
          }
          cur += step;
        }
      });

      const dep1 = new Set();
      (sched[term1] || []).forEach(b => {
        let cur = timeToSec(b.from) + (b.offsetSec || 0);
        const end = timeToSec(b.to) + (b.offsetSec || 0);
        const step = Math.round(b.frequencyMin * 60);
        while (cur <= end) {
          if (!dep1.has(cur)) {
            dep1.add(cur);
            const t = createTrip({ id: `${lineKey}-1-${idCounter++}`, lineKey, direction: 1, origin: term1, dest: term0, depSec: cur });
            if (t) trips.push(t);
          }
          cur += step;
        }
      });
    }

    if (loopsConfig?.loops) {
      loopsConfig.loops.forEach(loop => {
        const loopDep = new Set();
        let cur = timeToSec(loop.from) + (loop.offsetSec || 0);
        const end = timeToSec(loop.to) + (loop.offsetSec || 0);
        const step = Math.round(loop.freqMin * 60);
        while (cur <= end) {
          if (!loopDep.has(cur)) {
            loopDep.add(cur);
            const t = createTrip({ id: `${lineKey}-loop-${idCounter++}`, lineKey, direction: loop.direction, origin: loop.origin, dest: loop.dest, depSec: cur, isShortLoop: true });
            if (t) trips.push(t);
          }
          cur += step;
        }
      });
    }
  });

  TRIPS_CACHE.set(dayKey, trips);
  return trips;
}

let map = null;
const trainLayers = {};
let openPopupStation = null;
let allBounds = null;

function initializePhysicsAndMap() {
    // Map with full smooth panning, wheel zooming and gesture support
    map = L.map('map', {
        center: [12.9716, 77.5946],
        zoom: 12,
        minZoom: 8,
        maxZoom: 19,
        zoomControl: false,
        scrollWheelZoom: true,
        wheelDebounceTime: 40,
        wheelPxPerZoomLevel: 60,
        doubleClickZoom: true,
        touchZoom: true,
        dragging: true,
        boxZoom: true,
        keyboard: true
    });

    // Carto Voyager / OpenStreetMap Layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20,
        maxNativeZoom: 19
    }).addTo(map);

    const LINE_COLORS = { purple: '#8e24aa', green: '#43a047', yellow: '#fbc02d' };

    // Render Dual Track Polylines (interactive: false so clicks & drags pass directly through to map)
    Object.keys(LINE_TRACKS).forEach(lineId => {
        const track = LINE_TRACKS[lineId];
        const color = LINE_COLORS[lineId];
        const p1 = track.map(p => [p.p1Lat, p.p1Lng]);
        const p2 = track.map(p => [p.p2Lat, p.p2Lng]);

        L.polyline(p1, { color, weight: 3, opacity: 0.8, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
        L.polyline(p2, { color, weight: 3, opacity: 0.8, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
    });

    // Render Station Markers & Calculate Network Bounds
    const drawn = new Set();
    const latLngList = [];

    Object.keys(STATION_COORDS).forEach(lineId => {
        const anchors = STATION_COORDS[lineId];
        anchors.forEach(node => {
            if (node.isStation && !drawn.has(node.name)) {
                drawn.add(node.name);
                latLngList.push([node.lat, node.lng]);

                const isInter = INTERCHANGES.includes(normStation(node.name));
                const mClass = `station-marker marker-${lineId}` + (isInter ? ' interchange-marker' : '');

                const marker = L.marker([node.lat, node.lng], {
                    icon: L.divIcon({ className: mClass, iconSize: isInter ? [16, 16] : [12, 12] })
                }).addTo(map);

                marker.stationName = node.name;
                marker.bindPopup(() => buildUnifiedPopup(node.name), { minWidth: 320, maxWidth: 320 });
            }
        });
    });

    if (latLngList.length > 0) {
        allBounds = L.latLngBounds(latLngList);
    }

    // Isolate popup scrolling from map zooming so wheel scrolls the board smoothly
    map.on('popupopen', (e) => {
        if (e.popup && e.popup._source && e.popup._source.stationName) {
            openPopupStation = e.popup._source.stationName;
        }
        const el = e.popup?.getElement();
        if (el) {
            L.DomEvent.disableScrollPropagation(el);
            L.DomEvent.disableClickPropagation(el);
        }
    });

    map.on('popupclose', () => {
        openPopupStation = null;
    });

    // Prevent map drag interception when clicking on overlay glass panels
    document.querySelectorAll('.glass-panel, .map-controls').forEach(el => {
        L.DomEvent.disableScrollPropagation(el);
        L.DomEvent.disableClickPropagation(el);
    });

    // Handle Window Resizing / Maximizing
    window.addEventListener('resize', () => {
        if (map) {
            map.invalidateSize();
        }
    });

    window.addEventListener('orientationchange', () => {
        if (map) {
            setTimeout(() => map.invalidateSize(), 200);
        }
    });

    // Wire Map Control Buttons
    document.getElementById('btn-zoom-in')?.addEventListener('click', () => {
        if (map) map.zoomIn();
    });
    document.getElementById('btn-zoom-out')?.addEventListener('click', () => {
        if (map) map.zoomOut();
    });
    document.getElementById('btn-fit-network')?.addEventListener('click', () => {
        if (map && allBounds) {
            map.fitBounds(allBounds, { padding: [50, 50], animate: true });
        }
    });
    document.getElementById('btn-fullscreen')?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
        }
    });
}

function buildUnifiedPopup(stationName) {
    const currentSecs = getISTSecs();
    const dayKey = getDayKey();
    const allTrips = generateDayTrips(dayKey);
    const norm = normStation(stationName);

    const upcoming = [];

    allTrips.forEach(trip => {
        if (trip.destStation === norm) return;
        const stTiming = trip.stationTimings.find(s => s.stationName === norm);
        if (!stTiming) return;

        const depDiff = getDiffMins(stTiming.depSec, currentSecs);
        const arrDiff = getDiffMins(stTiming.arrSec, currentSecs);
        const dwell = getDwell(norm);

        if (depDiff >= -dwell && arrDiff <= 3600) {
            const diffMins = Math.max(0, Math.floor(arrDiff / 60));
            upcoming.push({
                tripId: trip.id,
                diff: arrDiff,
                mins: diffMins,
                dest: trip.destStation,
                plat: trip.direction === 0 ? 2 : 1,
                lineId: trip.lineKey,
                isDue: arrDiff <= 60 && depDiff >= 0,
                isShortLoop: trip.isShortLoop
            });
        }
    });

    upcoming.sort((a, b) => a.diff - b.diff);

    let rows = upcoming.length === 0 ? '<div class="no-trains">No upcoming trains in next 60m.</div>' : '';

    upcoming.slice(0, 8).forEach(train => {
        const timeDisplay = (train.mins === 0 || train.isDue)
            ? `<span class="time-due">Due</span>`
            : `<span class="time-val">${train.mins}</span><span class="time-unit">min</span>`;

        rows += `
            <div class="departure-item">
                <div class="dep-main">
                    <div class="dep-title-row">
                        <span class="m-logo">M</span>
                        <span class="line-badge badge-${train.lineId}">${train.lineId}</span>
                        <span class="destination-text">${train.dest}</span>
                    </div>
                    <div class="dep-subtitle">Scheduled · Platform ${train.plat}</div>
                </div>
                <div class="dep-time">${timeDisplay}</div>
            </div>
        `;
    });

    return `<div class="station-header">${stationName}</div><div class="departure-board">${rows}</div>`;
}

// ==========================================
// 6. ANIMATION & LIVE POSITIONING LOOP
// ==========================================
function updateSimulation() {
    const currentSecs = getISTSecs();
    const d = new Date(); const utc = d.getTime() + (d.getTimezoneOffset() * 60000); const ist = new Date(utc + (3600000 * 5.5));
    const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    
    const clockEl = document.getElementById('sys-clock');
    if (clockEl) {
        clockEl.innerText = `${days[ist.getDay()]} | ${ist.getHours().toString().padStart(2,'0')}:${ist.getMinutes().toString().padStart(2,'0')}:${ist.getSeconds().toString().padStart(2,'0')} IST`;
    }

    const dayKey = getDayKey();
    const allTrips = generateDayTrips(dayKey);
    const activeTripIds = new Set();

    allTrips.forEach(trip => {
        let elapsed = currentSecs - trip.startSec;
        if (elapsed < -43200) elapsed += 86400;
        if (elapsed > 43200) elapsed -= 86400;

        if (elapsed >= 0 && elapsed <= trip.totalSec) {
            activeTripIds.add(trip.id);
            const lineIdx = LINE_INDICES[trip.lineKey];
            const track = lineIdx.track;

            let isWaiting = false;
            let currentCoord = null;
            let heading = 0;

            const timings = trip.stationTimings;

            // Check if train is dwelling at a station
            for (let s = 0; s < timings.length; s++) {
                const st = timings[s];
                if (currentSecs >= st.arrSec && currentSecs <= st.depSec) {
                    isWaiting = true;
                    const trackIdx = lineIdx.stationTrackMap.get(st.stationName);
                    if (trackIdx !== undefined) {
                        const pt = track[trackIdx];
                        currentCoord = trip.direction === 0 ? [pt.p2Lat, pt.p2Lng] : [pt.p1Lat, pt.p1Lng];

                        if (s < timings.length - 1) {
                            const nextIdx = lineIdx.stationTrackMap.get(timings[s + 1].stationName);
                            if (nextIdx !== undefined) {
                                const npt = track[nextIdx];
                                const nlat = trip.direction === 0 ? npt.p2Lat : npt.p1Lat;
                                const nlng = trip.direction === 0 ? npt.p2Lng : npt.p1Lng;
                                heading = -Math.atan2(nlat - currentCoord[0], nlng - currentCoord[1]) * (180 / Math.PI);
                            }
                        }
                    }
                    break;
                }
            }

            // Train is moving between two stations
            if (!isWaiting) {
                for (let s = 0; s < timings.length - 1; s++) {
                    const stA = timings[s];
                    const stB = timings[s + 1];

                    if (currentSecs > stA.depSec && currentSecs < stB.arrSec) {
                        const prog = (currentSecs - stA.depSec) / (stB.arrSec - stA.depSec);
                        const idxA = lineIdx.stationTrackMap.get(stA.stationName);
                        const idxB = lineIdx.stationTrackMap.get(stB.stationName);

                        if (idxA !== undefined && idxB !== undefined) {
                            const step = idxB > idxA ? 1 : -1;
                            const subTrack = [];
                            for (let k = idxA; k !== idxB + step; k += step) {
                                subTrack.push(track[k]);
                            }

                            const dists = [0];
                            let totalDist = 0;
                            for (let k = 1; k < subTrack.length; k++) {
                                totalDist += getDistanceKM(subTrack[k-1].lat, subTrack[k-1].lng, subTrack[k].lat, subTrack[k].lng);
                                dists.push(totalDist);
                            }

                            const targetDist = prog * totalDist;
                            let segIdx = 0;
                            for (let k = 0; k < dists.length - 1; k++) {
                                if (targetDist >= dists[k] && targetDist <= dists[k+1]) {
                                    segIdx = k;
                                    break;
                                }
                            }

                            const pA = subTrack[segIdx];
                            const pB = subTrack[segIdx + 1] || pA;
                            const segSpan = dists[segIdx + 1] - dists[segIdx] || 1;
                            const segProg = (targetDist - dists[segIdx]) / segSpan;

                            const latA = trip.direction === 0 ? pA.p2Lat : pA.p1Lat;
                            const lngA = trip.direction === 0 ? pA.p2Lng : pA.p1Lng;
                            const latB = trip.direction === 0 ? pB.p2Lat : pB.p1Lat;
                            const lngB = trip.direction === 0 ? pB.p2Lng : pB.p1Lng;

                            currentCoord = [latA + (latB - latA) * segProg, lngA + (lngB - lngA) * segProg];
                            heading = -Math.atan2(latB - latA, lngB - lngA) * (180 / Math.PI);
                        }
                        break;
                    }
                }
            }

            if (currentCoord) {
                const iconHtml = `<div class="train-rect" style="transform: rotate(${heading}deg);"></div>`;

                if (!trainLayers[trip.id]) {
                    trainLayers[trip.id] = L.marker(currentCoord, {
                        interactive: false, // Ensure map underneath is freely draggable
                        keyboard: false,
                        icon: L.divIcon({
                            className: `train-icon train-${trip.lineKey} ${isWaiting ? 'train-waiting' : ''}`,
                            html: iconHtml,
                            iconSize: [22, 10],
                            iconAnchor: [11, 5]
                        })
                    }).addTo(map);
                } else {
                    trainLayers[trip.id].setLatLng(currentCoord);
                    const el = trainLayers[trip.id].getElement();
                    if (el) {
                        isWaiting ? el.classList.add('train-waiting') : el.classList.remove('train-waiting');
                        const rect = el.querySelector('.train-rect');
                        if (rect) rect.style.transform = `rotate(${heading}deg)`;
                    }
                }
            }
        }
    });

    // Clean up finished trains
    Object.keys(trainLayers).forEach(tripId => {
        if (!activeTripIds.has(tripId)) {
            map.removeLayer(trainLayers[tripId]);
            delete trainLayers[tripId];
        }
    });

    // Auto-update active popup
    if (openPopupStation && map && map._popup && map._popup.isOpen()) {
        map._popup.setContent(buildUnifiedPopup(openPopupStation));
    }

    requestAnimationFrame(updateSimulation);
}

// Initialize on DOM Ready
window.addEventListener('DOMContentLoaded', () => {
    initializePhysicsAndMap();
    requestAnimationFrame(updateSimulation);
});
</script>
</body>
</html>
